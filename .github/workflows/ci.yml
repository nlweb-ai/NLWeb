# ==============================================================================================
# NLWeb - Continuous Integration
# ==============================================================================================
# Runs on every push to main and on every pull request.
# Jobs: lint, unit-tests (matrix), docker-build-check
# ==============================================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# -------------------------------------------------------------------------------------------------
# Shared Environment
# -------------------------------------------------------------------------------------------------
env:
  PYTHON_DEFAULT: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_WARN_SCRIPT_LOCATION: "1"

permissions:
  contents: read

jobs:
  # =================================================================================================
  # 1. Lint & Static Analysis
  # =================================================================================================
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check . --output-format=github
      
      - name: Ruff format check
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy code --ignore-missing-imports
        continue-on-error: true

  # ====================================================================================================
  # 2. Security Scan (GitLeaks)
  # ====================================================================================================
  secrets-scan:
    name: "Secrets Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ====================================================================================================
  # 3. unit & Integration Tests (matrix: Python 3.10 /  3.11 / 3.12)
  # ====================================================================================================
  test:
    name: "Tests - Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-test.txt', 'code/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core project dependencies
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f code/requirements.txt ]; then pip install -r code/requirements.txt; fi
          # Test dependencies
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          # Ensure pytest and coverage are available
          pip install pytest pytest-cov pytest-asyncio hypothesis

      - name: Run tests with coverage
        env:
          # Provide dummy env vars so config loading doesn't crash
          OPENAI_API_KEY: "test-dummy-key"
          AZURE_OPENAI_API_KEY: "test-dummy-key"
          AZURE_OPENAI_ENDPOINT: "https://dummy.openai.azure.com"
        run: |
          python -m pytest tests/ \
            --tb=short \
            -q \
            --cov=code \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ==================================================================================
  # 4. Docker Build Smoke Test
  # ==================================================================================
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: lint
    if: hashFiles('Dockerfile') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nlweb:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max